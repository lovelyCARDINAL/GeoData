name: Build Trimmed GeoData

on:
  schedule:
    # 每天北京时间凌晨 02:00（UTC 18:00）自动构建
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download upstream dat files
        run: |
          curl -fsSL -o geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          curl -fsSL -o geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat

      - name: Filter and repackage dat files
        run: |
          go mod tidy
          go run .
          ls -lh geosite.dat geoip.dat dist/

      - name: Publish to release branch
        run: |
          cp -r rules dist/rules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan release
          git rm -rf . >/dev/null 2>&1 || true
          mv dist/geosite.dat dist/geoip.dat .
          mv dist/rules ./rules
          rm -rf dist
          git add geosite.dat geoip.dat rules
          git commit -m "chore: update trimmed geodata ($(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST'))"
          git push -f origin release
