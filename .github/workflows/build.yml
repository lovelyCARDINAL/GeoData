name: Build Trimmed GeoData

on:
  schedule:
    # 每天北京时间早上 07:00（UTC 23:00）自动构建
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download upstream dat and rule files
        run: |
          curl -fsSL -o geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          curl -fsSL -o geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL -o upstream_custom_direct.yaml https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Direct_Classical.yaml
          curl -fsSL -o upstream_custom_proxy.yaml https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Proxy_Classical.yaml
          curl -fsSL -o upstream_steam_cdn.yaml https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Steam_CDN_Classical.yaml
          curl -fsSL -o upstream_game_cdn.yaml https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Game_Download_CDN_Classical.yaml

      - name: Filter and repackage dat files
        run: |
          go mod tidy
          go run .
          ls -lh geosite.dat geoip.dat dist/
          echo "BUILD_TAG=$(TZ='Asia/Shanghai' date '+%Y%m%d')" >> $GITHUB_ENV

      - name: Publish to release branch
        run: |
          cp -r rules dist/rules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan release
          git rm -rf . >/dev/null 2>&1 || true
          cp dist/geosite.dat dist/geoip.dat .
          cp -r dist/rules ./rules
          git add geosite.dat geoip.dat rules
          git commit -m "chore: update trimmed geodata ($(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST'))"
          git push -f origin release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: "Released on ${{ env.BUILD_TAG }}"
          body: "Automated trimmed geosite.dat, geoip.dat & standalone YAML rule-providers."
          make_latest: true
          files: |
            dist/geosite.dat
            dist/geoip.dat
            dist/rules/moegirl.yaml
            dist/rules/qiuwen.yaml
            dist/rules/wikimedia.yaml
            dist/rules/pcdn-reject.yaml

      - name: Purge jsDelivr cache
        run: |
          for path in geosite.dat geoip.dat rules/moegirl.yaml rules/qiuwen.yaml rules/wikimedia.yaml rules/grok.yaml rules/museai.yaml rules/cursor.yaml rules/hijack-reject.yaml rules/pcdn-reject.yaml; do
            curl -fsSL "https://purge.jsdelivr.net/gh/lovelyCARDINAL/GeoData@release/${path}" || true
          done
